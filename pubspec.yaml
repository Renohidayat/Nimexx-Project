name: nimexx
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  google_fonts: ^6.1.0
  curved_navigation_bar: ^1.0.6
  salomon_bottom_bar: ^3.3.2
  shimmer: ^3.0.0
  timeago: ^3.7.1
  fl_chart: ^1.0.0
  syncfusion_flutter_charts: ^29.2.11
  
  


  # Networking & Web Support
  http: ^1.3.0
  html: ^0.15.5+1
  connectivity_plus: ^5.0.2
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  google_sign_in: ^6.3.0
  firebase_auth_web: ^5.15.0
  cloud_firestore: ^5.6.8
  intl: ^0.20.2
  firebase_remote_config: ^5.4.5

  # Video & Webview
  chewie: ^1.13.1
  webview_flutter: ^4.0.1
  webview_flutter_android: ^4.0.1

  # State Management & Routing
  rxdart: ^0.27.7
  shared_preferences: ^2.5.3
  image_picker: ^1.2.4
  video_player: ^2.14.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4


flutter_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png" 

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/wibu.png
    - assets/images/h2.png
    - assets/images/h3.png
    - assets/images/h4.png
    - assets/images/zero.jpg
    - assets/images/vivy.jpg
    - assets/images/vinlan.jpg
    - assets/images/teror.jpg
    - assets/images/solo.jpg
    - assets/images/sao.jpg
    - assets/images/monster.jpg
    - assets/images/dororo.jpg
    - assets/images/kny.jpg
    - web/assets/og-image.jpg
    - assets/images/love-anime.gif
   


