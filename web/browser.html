<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Open in Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4361ee;
      --primary-hover: #3a56d4;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow);
      text-align: center;
      border: 1px solid var(--border);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(67, 97, 238, 0.1);
      border-radius: 50%;
      color: var(--primary);
      font-size: 28px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    p {
      font-size: 15px;
      color: var(--text-light);
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      background: var(--primary);
      color: white;
      font-weight: 500;
      border-radius: var(--radius-md);
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      width: 100%;
      max-width: 240px;
      margin: 0 auto 24px;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn i {
      margin-right: 8px;
      font-size: 18px;
    }

    .fallback {
      font-size: 13px;
      color: var(--text-light);
    }

    .fallback-title {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .url {
      display: inline-block;
      background: rgba(226, 232, 240, 0.5);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin-top: 12px;
      color: var(--text);
      border: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
      }
      
      h1 {
        font-size: 20px;
      }
      
      p {
        font-size: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="card">
    <div class="icon">
      <i class="fas fa-external-link-alt"></i>
    </div>
    <h1>Continue in Browser</h1>
    <p>Instagram limits link previews. Click below to open the full content in your browser.</p>
    <a class="btn" href="intent://nimexx.web.app#Intent;scheme=https;package=com.android.chrome;end;">
      <i class="fab fa-chrome"></i> Open in Chrome
    </a>
    <div class="fallback">
      <span class="fallback-title">Or copy this link:</span>
      <div class="url">https://nimexx.web.app</div>
    </div>
  </div>
</body>
</html>
